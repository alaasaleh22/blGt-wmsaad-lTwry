openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Emergency incident reports and assistance requests
  - name: interviews
    description: Interactive interview practice across professional and vocational fields
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit an emergency report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get aggregate report counts
      responses:
        "200":
          description: Aggregate emergency report counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
  /reports/{trackingCode}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Retrieve a report using its private tracking code
      parameters:
        - name: trackingCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /interviews:
    post:
      operationId: createInterview
      tags: [interviews]
      summary: Start an interview practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewInput"
      responses:
        "201":
          description: Interview created with its first question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewDetail"
  /interviews/{id}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get an interview and its saved turns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interview session and turns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewDetail"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /interviews/{id}/answers:
    post:
      operationId: submitInterviewAnswer
      tags: [interviews]
      summary: Submit a text answer and receive feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewAnswerInput"
      responses:
        "200":
          description: Answer feedback and the next question or final evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewAnswerResult"
        "400":
          description: Invalid answer or session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /interviews/{id}/avatar-options:
    get:
      operationId: getInterviewAvatarOptions
      tags: [interviews]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Available real-time video interviewers
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InterviewAvatarOptions"}
        "503":
          description: Video provider unavailable
  /interviews/{id}/avatar/start:
    post:
      operationId: startInterviewAvatar
      tags: [interviews]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InterviewAvatarInput"}
      responses:
        "200":
          description: Short-lived receive-only video connection details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InterviewAvatarConnection"}
        "400":
          description: Invalid session or missing spending consent
        "403":
          description: Paid video sessions disabled by project owner
        "409":
          description: Video session already active
        "502":
          description: Video provider unavailable
  /interviews/{id}/avatar/stop:
    post:
      operationId: stopInterviewAvatar
      tags: [interviews]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InterviewAvatarStopInput"}
      responses:
        "200":
          description: Video session stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: {type: boolean}
                required: [stopped]
  /interviews/{id}/question-audio:
    post:
      operationId: readInterviewQuestion
      tags: [interviews]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Current question spoken as PCM16 24kHz audio and transcript SSE
          content:
            text/event-stream: {}
        "400":
          description: No active question
  /interviews/{id}/voice-turn:
    post:
      operationId: sendInterviewVoiceTurn
      tags: [interviews]
      summary: Send a recorded answer and receive a spoken next question
      description: Accepts base64-encoded browser audio and returns transcript/audio SSE events.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewVoiceInput"
      responses:
        "200":
          description: SSE events for transcript and generated audio
          content:
            text/event-stream: {}
        "400":
          description: Invalid audio or session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /interviews/{id}/finish:
    post:
      operationId: finishInterview
      tags: [interviews]
      summary: Finish early and generate a final evaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Completed interview with evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewDetail"
        "400":
          description: Interview has no answer to evaluate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReportInput:
      type: object
      properties:
        incidentType:
          type: string
          enum: [fire, flood, earthquake, medical, building, other]
        description:
          type: string
          minLength: 10
          maxLength: 2000
        locationText:
          type: string
          minLength: 3
          maxLength: 300
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        urgency:
          type: string
          enum: [critical, high, normal]
        contactName:
          type: ["string", "null"]
          maxLength: 100
        contactPhone:
          type: ["string", "null"]
          maxLength: 30
      required:
        - incidentType
        - description
        - locationText
        - latitude
        - longitude
        - urgency
        - contactName
        - contactPhone
    Report:
      type: object
      properties:
        id:
          type: integer
        trackingCode:
          type: string
        incidentType:
          type: string
          enum: [fire, flood, earthquake, medical, building, other]
        description:
          type: string
        locationText:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        urgency:
          type: string
          enum: [critical, high, normal]
        status:
          type: string
          enum: [received, reviewing, dispatched, resolved]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - trackingCode
        - incidentType
        - description
        - locationText
        - latitude
        - longitude
        - urgency
        - status
        - contactName
        - contactPhone
        - createdAt
        - updatedAt
    ReportSummary:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        resolved:
          type: integer
      required: [total, active, resolved]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    InterviewInput:
      type: object
      properties:
        roleTitle:
          type: string
          minLength: 2
          maxLength: 120
        track:
          type: string
          enum: [software, industrial, mechanical, electrical, electrical_technology, electrical_trades, electronics, automation, hvac, automotive, energy, occupational_safety, oil_gas, agriculture, civil, healthcare, education, business, finance, sales, hospitality, logistics, skilled_trades, legal, media, science, other]
        experienceLevel:
          type: string
          enum: [junior, mid, senior]
        language:
          type: string
          enum: [ar, en]
        mode:
          type: string
          enum: [text, voice]
        questionCount:
          type: integer
          minimum: 1
          maximum: 20
      required: [roleTitle, track, experienceLevel, language, mode, questionCount]
    InterviewAnswerInput:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 5000
        candidateImage:
          $ref: "#/components/schemas/CandidateCameraImage"
      required: [answer]
    CandidateCameraImage:
      type: string
      maxLength: 1000000
      pattern: '^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$'
      description: Optional consented JPEG snapshot sent with this answer only. Never persisted by the application.
    InterviewAvatarOptions:
      type: object
      properties:
        configured: {type: boolean}
        paidEnabled: {type: boolean}
        sandboxAvatarId: {type: string, format: uuid}
        sandboxMaxSeconds: {type: integer}
        avatars:
          type: array
          items: {$ref: "#/components/schemas/InterviewAvatar"}
      required: [configured, paidEnabled, sandboxAvatarId, sandboxMaxSeconds, avatars]
    InterviewAvatar:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        previewUrl: {type: [string, "null"]}
      required: [id, name, previewUrl]
    InterviewAvatarInput:
      type: object
      properties:
        avatarId: {type: string, format: uuid}
        isSandbox: {type: boolean}
        acceptCharges: {type: boolean}
      required: [avatarId, isSandbox, acceptCharges]
    InterviewAvatarStopInput:
      type: object
      properties:
        sessionId: {type: string, format: uuid}
      required: [sessionId]
    InterviewAvatarConnection:
      type: object
      properties:
        sessionId: {type: string, format: uuid}
        livekitUrl: {type: string}
        livekitToken: {type: string}
        websocketUrl: {type: string}
        isSandbox: {type: boolean}
        maxDurationSeconds: {type: integer}
      required: [sessionId, livekitUrl, livekitToken, websocketUrl, isSandbox, maxDurationSeconds]
    InterviewVoiceInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded browser or phone recording.
        candidateImage:
          $ref: "#/components/schemas/CandidateCameraImage"
        expectedQuestionNumber:
          type: integer
          minimum: 1
          maximum: 20
          description: The original question being answered; prevents a retried recording from answering a later question.
      required: [audio]
    InterviewEvaluation:
      type: object
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string
      required: [overallScore, summary, strengths, improvements, nextSteps]
    InterviewSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roleTitle:
          type: string
        track:
          type: string
          enum: [software, industrial, mechanical, electrical, electrical_technology, electrical_trades, electronics, automation, hvac, automotive, energy, occupational_safety, oil_gas, agriculture, civil, healthcare, education, business, finance, sales, hospitality, logistics, skilled_trades, legal, media, science, other]
        experienceLevel:
          type: string
          enum: [junior, mid, senior]
        language:
          type: string
          enum: [ar, en]
        mode:
          type: string
          enum: [text, voice]
        questionCount:
          type: integer
        status:
          type: string
          enum: [active, completed]
        currentQuestion:
          type: ["string", "null"]
        turnNumber:
          type: integer
        evaluation:
          anyOf:
            - $ref: "#/components/schemas/InterviewEvaluation"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - roleTitle
        - track
        - experienceLevel
        - language
        - mode
        - questionCount
        - status
        - currentQuestion
        - turnNumber
        - evaluation
        - createdAt
        - updatedAt
    InterviewTurn:
      type: object
      properties:
        id:
          type: integer
        interviewId:
          type: string
          format: uuid
        questionNumber:
          type: integer
        question:
          type: string
        answer:
          type: ["string", "null"]
        score:
          type: ["integer", "null"]
        feedback:
          type: ["string", "null"]
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        voiceReply:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - interviewId
        - questionNumber
        - question
        - answer
        - score
        - feedback
        - strengths
        - improvements
        - voiceReply
        - createdAt
    InterviewDetail:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/InterviewSession"
        turns:
          type: array
          items:
            $ref: "#/components/schemas/InterviewTurn"
      required: [session, turns]
    InterviewAnswerResult:
      type: object
      properties:
        visualObservation:
          type: string
          description: Ephemeral neutral observation of a consented snapshot, excluded from scoring and storage.
        session:
          $ref: "#/components/schemas/InterviewSession"
        turn:
          $ref: "#/components/schemas/InterviewTurn"
        nextQuestion:
          type: ["string", "null"]
        evaluation:
          anyOf:
            - $ref: "#/components/schemas/InterviewEvaluation"
            - type: "null"
      required: [session, turn, nextQuestion, evaluation]

